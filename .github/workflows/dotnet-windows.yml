name: .NET Windows libraries

# The tests of the Windows .NET libraries (the ext-dotnet-v packages): res/system audio and
# clipboard, res/web WebView2 and res/int ONNX.
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  tests:
    if: toJSON(fromJSON(inputs.cells)['tests']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['tests'] }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Tests
        shell: bash
        run: scripts/lang/dotnet.sh test
      - name: Pack
        shell: bash
        run: scripts/lang/dotnet.sh pack
