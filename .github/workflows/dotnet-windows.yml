name: .NET Windows libraries

# The tests of the Windows .NET libraries (the ext-dotnet-v packages): res/system audio and
# clipboard, res/web WebView2 and res/int ONNX. It runs on pull requests that touch these
# libraries, as ext-plugin-release.yml and ext-zig-release.yml do for theirs, so a change to one
# is checked before it merges; native.yml and ext-dotnet-release.yml run the same tests. Also on demand
# (gh workflow run dotnet-windows.yml --ref <branch>).
on:
  pull_request:
    paths:
      - 'scripts/lang/**'
      - 'res/system/capture/audio/windows/**'
      - 'res/system/capture/clipboard/windows/**'
      - 'res/web/windows/**'
      - 'res/int/model/windows/**'
      - 'scripts/dotnet/**'
      - '.github/workflows/dotnet-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Tests
        shell: bash
        run: scripts/lang/dotnet.sh test
      - name: Pack
        shell: bash
        run: scripts/lang/dotnet.sh pack
