name: Lua SDK

# The Lua guest SDK (pkg/ext-lua) on every Lua it supports: its own tests, the conformance suite
# through the Go process host and the frames suite through the Go session (scripts/ext-lua.sh).
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  lua:
    if: toJSON(fromJSON(inputs.cells)['lua']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['lua'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - name: Test the SDK and run it under the Go hosts
        env:
          EXT_LUA: ${{ startsWith(matrix.lua, 'luajit') && 'luajit' || 'lua' }}
        run: scripts/lang/lua.sh test

  rock:
    if: toJSON(fromJSON(inputs.cells)['rock']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['rock'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4.9'
      - uses: leafo/gh-actions-luarocks@v6
      - name: Lint and install the rockspec, then load the installed modules
        run: scripts/lang/lua.sh rock
