name: ext-php

# The PHP guest SDK (pkg/ext-php).
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  php:
    if: toJSON(fromJSON(inputs.cells)['php']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['php'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: Unit tests, the shared fixtures, and the guest under the Go process host
        timeout-minutes: 16
        run: scripts/lang/php.sh test
