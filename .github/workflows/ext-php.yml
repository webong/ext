name: ext-php

# The PHP guest SDK (pkg/ext-php). Runs on pushes to main and on demand
# (gh workflow run ext-php.yml --ref <branch>). Branches and pull requests do not start it, to
# save runner time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.4']
        include:
          - os: macos-latest
            php: '8.4'
          - os: windows-latest
            php: '8.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: Unit tests, the shared fixtures, and the guest under the Go process host
        timeout-minutes: 16
        run: scripts/lang/php.sh test
