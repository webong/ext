name: Release ext-io (PyPI)

# Releases the Python package ext-io (pkg/ext-python) to PyPI and attaches the sdist and wheel to a GitHub
# release. It publishes for ext-python-vX.Y.Z tags only, and the PyPI job waits in the `pypi` environment
# for a required reviewer. A pull request that touches the package and a manual run test, build and check
# the distributions, and publish nothing. The tag is not a Go module tag; see docs/module-versioning.md.
# The tag's version must equal the version in pkg/ext-python/pyproject.toml.
#
# PyPI credentials: PyPI trusted publishing only (no secret, even for the first release). Before the
# first release, add a pending publisher for the project ext-io naming the repository webong/ext, the
# workflow ext-python-release.yml and the environment pypi.
on:
  push:
    tags: ['ext-python-v*']
  pull_request:
    paths:
      - 'pkg/ext-python/**'
      - '.github/workflows/ext-python-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ext-python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests and builds before anything is published. Read-only: it has no token that can write.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pkg/ext-python/pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$REF_TYPE" == tag ]]; then version="${REF_NAME#ext-python-v}"; else version="$declared"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version '$version' must look like 0.1.0" >&2; exit 1; }
          [[ "$declared" == "$version" ]] || { echo "pkg/ext-python/pyproject.toml says $declared but the release is $version" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Test
        run: python3 -I -m unittest discover -s pkg/ext-python/tests
      - name: Build and check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist/ext-python-$VERSION"
          python3 -m pip install --quiet build==1.3.0 twine==6.2.0
          python3 -m build --outdir "$out" pkg/ext-python
          python3 -m twine check --strict "$out"/*
          ls "$out/ext_io-$VERSION-py3-none-any.whl" "$out/ext_io-$VERSION.tar.gz"
      - name: Check that the wheel installs and imports
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          venv="$(mktemp -d)"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet "dist/ext-python-$VERSION/ext_io-$VERSION-py3-none-any.whl"
          (cd "$venv" && "$venv/bin/python" -I -c 'import ext_io.plugin, ext_io.host; print("imports ext_io.plugin and ext_io.host")')
      - name: Checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: (cd "dist/ext-python-$VERSION" && sha256sum ./*.whl ./*.tar.gz | tee checksums.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: ext-python-${{ steps.version.outputs.version }}
          path: dist/ext-python-${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  # Attaches the tested distributions to a GitHub release. Only a pushed ext-python-v tag gets here.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ext-python-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ext-python-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify checksums
        run: (cd dist && sha256sum -c checksums.txt)
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      # Not "latest": install.sh and install.ps1 resolve the newest ctx-v release by tag.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest=false --title "$GITHUB_REF_NAME"

  # Uploads the exact distributions that were tested, after a reviewer approves the `pypi` environment.
  pypi:
    needs: [build, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ext-python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ext-io/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ext-python-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify checksums
        run: (cd dist && sha256sum -c checksums.txt && rm checksums.txt)
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
