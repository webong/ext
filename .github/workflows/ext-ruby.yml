name: ext-ruby

# The Ruby guest SDK (pkg/ext-ruby): its Minitest suite on every supported Ruby, the gem build, and
# the Go conformance suite that runs it through the process host.
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  ruby:
    if: toJSON(fromJSON(inputs.cells)['ruby']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['ruby'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: Minitest, both gems, and the guest under the Go process host
        run: scripts/lang/ruby.sh test
