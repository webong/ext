name: Host cases

# The shared host cases (lib/plugin/testdata/v1/host-cases.json) on every host that has a runner:
# the pure-Go host and the hosts that bind the C engine (scripts/host-cases.sh), on Linux, macOS and
# Windows.
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  # The cgo-free C ABI loader (cshared on purego) held to the cases the cgo loader passes: the
  # cshared tests and the shared host cases with CGO_ENABLED=0, on every platform it supports.
  # The guests are built with cgo; only the host is cgo-free. The hosts job below runs the same
  # host cases with cgo off as one step of scripts/host-cases.sh.
  go-purego:
    name: go host without cgo (${{ matrix.os }})
    if: toJSON(fromJSON(inputs.cells)['go-purego']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['go-purego'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows-latest'
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows-11-arm'
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: mingw-w64-clang-aarch64-clang
      - name: cshared and the host cases without cgo
        if: runner.os != 'Windows'
        run: scripts/cshared-purego.sh
      - name: cshared and the host cases without cgo (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: ${{ matrix.os == 'windows-11-arm' && 'clang' || 'gcc' }}
        run: scripts/cshared-purego.sh

  hosts:
    if: toJSON(fromJSON(inputs.cells)['hosts']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['hosts'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
          # The action's cache key names the OS and architecture but not the runner image, so a Lua
          # built on ubuntu-latest (newer glibc) would be restored on ubuntu-22.04. It builds in seconds.
          buildCache: 'false'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, json
          coverage: none
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Host cases
        env:
          PYTHON: python
          EXT_LUA: ${{ startsWith(matrix.lua, 'luajit') && 'luajit' || 'lua' }}
        run: scripts/host-cases.sh

  # Windows: the engine built with MinGW-w64 (gcc, from MSYS2) or with MSVC (cl). Go's cgo cannot
  # use cl, so the Go-built C ABI guest is built by the MinGW gcc either way; the MSVC variant
  # shows that the engine's DLL, built by the other compiler, loads it and passes the same cases.
  # MSVC is experimental, as in plugin-engine.yml, and reports without blocking.
  #
  # Ruby and Lua come from MSYS2 in the MinGW variant, so their native modules are built by the
  # same gcc. The MSVC variant has RubyInstaller's Ruby (its extension built by the MSYS2 devkit
  # setup-ruby installs) and a Lua the Lua action builds with cl, so ext_io.host.core is built by
  # cl too. The Lua action runs after the MSVC environment is set and before setup-ruby, whose
  # devkit /usr/bin (with a link of its own) it puts on the path.
  windows:
    name: hosts (windows, ${{ matrix.toolchain }})
    if: toJSON(fromJSON(inputs.cells)['windows']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['windows'] }}
    runs-on: windows-latest
    continue-on-error: ${{ matrix.toolchain == 'msvc' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, json
          coverage: none
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: msys2/setup-msys2@v2
        if: matrix.toolchain == 'mingw'
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ruby
            mingw-w64-x86_64-lua
            make
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.toolchain == 'msvc'
      - uses: leafo/gh-actions-lua@v13
        if: matrix.toolchain == 'msvc'
        with:
          luaVersion: '5.4.9'
          buildCache: 'false'
      - uses: ruby/setup-ruby@v1
        if: matrix.toolchain == 'msvc'
        with:
          ruby-version: '3.4'
      - name: Host cases (MinGW-w64)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        env:
          PYTHON: python
        run: scripts/host-cases.sh
      - name: Host cases (MSVC)
        if: matrix.toolchain == 'msvc'
        shell: bash
        env:
          PYTHON: python
          EXT_ENGINE_CC: cl
          EXT_LUA_CC: cl
        run: scripts/host-cases.sh
