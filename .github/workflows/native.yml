name: Native core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run it on a branch before a pull request exists

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows' || runner.os == 'Linux'
        with:
          dotnet-version: '8.0.x'
      - name: Validate Windows system library
        if: runner.os == 'Windows'
        shell: bash
        run: go test -v ./res/system/... -timeout 5m
      - name: Test library modules
        shell: bash # the loop is bash; Windows runners default to PowerShell
        run: |
          for module in cmd/ext src/ctx src/ctn res/system res/int res/content pkg/ext-go pkg/ext-go/engine pkg/ext-go/cgoengine pkg/ext-go/hashicorp pkg/ext-go/wasm pkg/ext-go/inference pkg/ext-go/model pkg/ext-go/perception pkg/ext-go/realtime adapters/wasm adapters/evm adapters/systemd adapters/pulseaudio adapters/alsa adapters/x11 adapters/wayland adapters/pipewire adapters/openai adapters/ollama adapters/anthropic adapters/gemini res/web; do
            (cd "$module" && go test ./...) || exit 1
          done
      - name: Test intelligence contracts with race detector
        run: go test -race ./res/int/inference/... ./res/int/perception/... ./pkg/ext-go/perception/... ./pkg/ext-go/realtime/... -timeout 5m
      - name: Cross-build inference adapters for Windows
        shell: bash
        run: |
          for module in adapters/openai adapters/ollama adapters/anthropic adapters/gemini; do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/$(basename "$module").exe" "./$module"
          done
      - name: Validate isolated native graph processes
        working-directory: res/system
        env:
          EXT_GRAPH_PROCESS_NATIVE_TESTS: '1'
        run: go test -race -v . -run '^(TestNativeProcess|TestProcess)' -count=3 -timeout=5m
      - name: Validate portable Android system contracts
        if: runner.os != 'Windows'
        run: scripts/system-android.sh
      - name: Validate Android system network contracts
        if: runner.os != 'Windows'
        run: scripts/network-android.sh
      - name: Validate Android ML contracts and optional TensorFlow Lite backend
        if: runner.os != 'Windows'
        run: scripts/ml-android.sh
      - name: Generic iOS ExtSystem build
        if: runner.os == 'macOS'
        run: xcodebuild -scheme ExtSystem -destination 'generic/platform=iOS' -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
        working-directory: res/system/ios
      - name: Generic iOS ExtNetwork build
        if: runner.os == 'macOS'
        run: xcodebuild -scheme ExtNetwork -destination 'generic/platform=iOS' -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
        working-directory: res/system/network/ios
      - name: Swift tests (ExtSystem)
        if: runner.os == 'macOS'
        run: swift test
        working-directory: res/system/ios
      - name: Swift tests (ExtNetwork)
        if: runner.os == 'macOS'
        run: swift test
        working-directory: res/system/network/ios
      - name: Swift tests (ExtML)
        if: runner.os == 'macOS'
        run: swift test
        working-directory: res/int/model/ios
      - name: Validate native CoreML guest through CTN
        if: runner.os == 'macOS'
        run: |
          swift build --product ext-coreml-guest --package-path res/int/model/ios
          EXT_COREML_GUEST_BINARY="$PWD/res/int/model/ios/.build/debug/ext-coreml-guest" go test ./src/ctn/internal/app -run '^TestModelRunThroughCoreMLGuest$' -count=1
          cmake -S pkg/ext-go/cgoengine/_csrc -B "$RUNNER_TEMP/ext-model-cengine" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/ext-model-cengine" --target ext_host_static -j 4
          EXT_COREML_GUEST_BINARY="$PWD/res/int/model/ios/.build/debug/ext-coreml-guest" CGO_LDFLAGS="-L$RUNNER_TEMP/ext-model-cengine" go test -tags ext_cengine ./src/ctn/internal/app -run '^TestModelRunThroughCoreMLGuest$' -count=1
      - name: Validate Windows system and WebView2 libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet build res/system/windows/Ext.System.Windows.csproj
          dotnet build res/int/model/windows/Ext.ML.Windows.csproj
          dotnet run --project res/int/model/windows/Tests/Ext.ML.Windows.Tests.csproj
          dotnet build res/web/windows/Ext.Web.Windows.csproj
          dotnet run --project res/web/windows/Tests/Ext.Web.Windows.Tests.csproj
      - name: Validate native ONNX guest through CTN
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish res/int/model/windows/Guest/Ext.ML.Windows.Guest.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$env:RUNNER_TEMP/onnx-guest"
          $env:EXT_ONNX_GUEST_BINARY = Join-Path $env:RUNNER_TEMP 'onnx-guest/Ext.ML.Windows.Guest.exe'
          go test ./src/ctn/internal/app -run '^TestModelRunThroughONNXGuest$' -count=1
      - name: Validate Linux ONNX guest through CTN
        if: runner.os == 'Linux'
        run: |
          dotnet run --project res/int/model/windows/Tests/Ext.ML.Windows.Tests.csproj
          dotnet publish res/int/model/linux/Guest/Ext.ML.Linux.Guest.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$RUNNER_TEMP/onnx-guest"
          EXT_ONNX_GUEST_BINARY="$RUNNER_TEMP/onnx-guest/Ext.ML.Linux.Guest" go test ./src/ctn/internal/app -run '^TestModelRunThroughONNXGuest$' -count=1
      - name: Validate isolated native cookie credentials
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          CTX_COOKIE_NATIVE_CREDENTIAL_TESTS: '1'
        run: go test -v ./adapters/chromium/engine -run '^TestNativeCookieCredentials' -count=1
      - name: Validate isolated native credential store
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          CTX_CREDENTIAL_NATIVE_TESTS: '1'
        run: go test -v ./adapters/keychain/store ./adapters/credman/store -run '^TestNative(KeychainCredential|CredentialManager)RoundTrip$' -count=1
      - run: go build ./src/ctx/cmd/ctx
      - name: Test Windows source installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_native_test.ps1
      # ctx launches PowerShell adapters through powershell.exe, which is Windows PowerShell
      # 5.1, and most people run install.ps1 from it too. The step above runs PowerShell 7, so
      # the same test runs again here, where it also parses every adapter script with the 5.1
      # parser. The check keeps this step from quietly running on PowerShell 7.
      - name: Test Windows source installer (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw "expected Windows PowerShell, got $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)" }
          "Windows PowerShell $($PSVersionTable.PSVersion)"
          ./tests/windows_native_test.ps1

  # Packaging checks run independently of the broad module suite and provision
  # the tools they need instead of relying on the runner's Android defaults.
  android-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android packaging toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: Stage Android SDK release (non-publishing)
        run: scripts/ext-android-release.sh 0.0.0

  ios-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple packaging toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Stage iOS SDK release (non-publishing)
        run: scripts/ext-ios-release.sh 0.0.0

  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install isolated native desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pipewire pipewire-bin wireplumber dbus-x11 sway grim wf-recorder
      - name: Verify real PipeWire and Wayland sessions
        run: scripts/verify-linux-desktop.sh

  native-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - run: ./tests/native_test.sh
      - run: ./tests/native_installer_test.sh

  # Every published module has to build on its own, the way `go install module@version`
  # or a consumer sees it: workspace off, go.mod and go.sum complete. The offline test
  # in src/ctx/internal/arch catches missing requirements on every pull request; this
  # job checks the real thing against the published tags. It fetches modules from
  # GitHub, so it runs after merges and not on pull requests, whose sibling versions
  # may not be published yet. A module waiting for an unpublished sibling is skipped
  # with a message and checked by the next run.
  standalone-modules:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: ./scripts/check-standalone-modules.sh
        env:
          # Development main may contain dependencies awaiting a release round.
          # Release checks use the script's strict default instead.
          STANDALONE_ALLOW_SKIPS: '1'
