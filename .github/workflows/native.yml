name: Native core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test library modules
        run: |
          for module in src/ctx examples pkg/graph pkg/plugin pkg/plugin-cshared pkg/plugin-go pkg/plugin-hashicorp pkg/plugin-wasm res/browser res/credential; do
            (cd "$module" && go test ./...) || exit 1
          done
      - name: Validate isolated native graph processes
        working-directory: pkg/graph
        env:
          CTX_GRAPH_PROCESS_NATIVE_TESTS: '1'
        run: go test -race -v ./system -run '^(TestNativeProcess|TestProcess)' -count=3 -timeout=5m
      - name: Validate isolated native cookie credentials
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          CTX_COOKIE_NATIVE_CREDENTIAL_TESTS: '1'
        run: go test -v ./adapters/chromium/engine -run '^TestNativeCookieCredentials' -count=1
      - name: Validate isolated native credential store
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          CTX_CREDENTIAL_NATIVE_TESTS: '1'
        run: go test -v ./adapters/keychain/store ./adapters/credman/store -run '^TestNative(KeychainCredential|CredentialManager)RoundTrip$' -count=1
      - run: go build ./src/ctx/cmd/ctx
      - name: Test Windows source installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_native_test.ps1

  native-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: ./tests/native_test.sh
      - run: ./tests/native_installer_test.sh
