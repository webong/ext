name: Plugin engine

# Builds the portable C plugin engine in lib/plugin and runs its native tests and the Go suites that
# link against it, on Linux, macOS and Windows (MinGW-w64).
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  posix:
    if: toJSON(fromJSON(inputs.cells)['posix']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['posix'] }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - name: Build the engine and run its tests
        run: scripts/plugin-engine-test.sh "$RUNNER_TEMP/engine"

  # Sanitizers do not see an input that is merely slow, so the parsers and
  # validators also get a short libFuzzer run with a per-input time limit.
  fuzz:
    if: toJSON(fromJSON(inputs.cells)['fuzz']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['fuzz'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the fuzz target
        run: |
          cmake -S lib/plugin -B "$RUNNER_TEMP/fuzz" -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXT_FUZZ=ON
          cmake --build "$RUNNER_TEMP/fuzz" --target ext_fuzz
      - name: Fuzz for a minute
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cp lib/plugin/testdata/fuzz/*.json lib/plugin/testdata/v1/*.json "$RUNNER_TEMP/corpus/"
          "$RUNNER_TEMP/fuzz/ext_fuzz" -max_len=262144 -timeout=5 -max_total_time=60 "$RUNNER_TEMP/corpus"

  windows:
    if: toJSON(fromJSON(inputs.cells)['windows']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['windows'] }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build the engine and run its tests
        shell: msys2 {0}
        run: scripts/plugin-engine-test.sh "$RUNNER_TEMP/engine"

  # Windows on ARM64 with clang from MSYS2. Experimental: it reports without
  # blocking until the toolchain has proven stable on hosted runners.
  windows-arm64:
    if: toJSON(fromJSON(inputs.cells)['windows-arm64']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['windows-arm64'] }}
    runs-on: windows-11-arm
    continue-on-error: true
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-winpthreads
      - name: Build the engine and run its tests
        shell: msys2 {0}
        run: scripts/plugin-engine-test.sh "$RUNNER_TEMP/engine"

  # The C engine built with MSVC (cl), through the Win32 shim in src/sync.h.
  # Native tests only: cgo links the MinGW build, not this one. Experimental.
  windows-msvc:
    if: toJSON(fromJSON(inputs.cells)['windows-msvc']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['windows-msvc'] }}
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the engine with MSVC and run the native tests
        shell: bash
        env:
          EXT_ENGINE_C_ONLY: '1'
          CC: cl
        run: scripts/plugin-engine-test.sh "$RUNNER_TEMP/engine"
