name: Plugin SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test plugin library modules
        run: |
          for module in pkg/ext-go pkg/ext-go/engine pkg/ext-go/cgoengine pkg/ext-go/hashicorp pkg/ext-go/wasm; do
            (cd "$module" && go test -race ./...) || exit 1
          done
      - run: go test -race ./pkg/ext-go/hashicorp/cmd/ext-plugin
      - run: node --test pkg/ext-ts/test.mjs pkg/ext-ts/frames.test.mjs pkg/ext-ts/router.test.mjs
      - run: python3 -I -m unittest discover -s pkg/ext-python/tests
      - name: Check TypeScript declarations
        run: npx --yes --package typescript@5.8.3 tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 pkg/ext-ts/typecheck.mts
      - run: go run ./pkg/ext-go/examples/plugin-sdk --backend jsonline
      - run: go run ./pkg/ext-go/examples/plugin-sdk --backend inprocess
      - run: go run ./pkg/ext-go/examples/plugin-typescript
      - run: go build -o /tmp/ext-plugin-example ./pkg/ext-go/examples/plugin-typescript
      - run: node pkg/ext-go/examples/plugin-typescript/host.mjs /tmp/ext-plugin-example
      - run: go run ./pkg/ext-go/hashicorp/cmd/ext-plugin inspect --root pkg/ext-go/examples/plugin-package --entry main pkg/ext-go/examples/plugin-package/plugin.json

  foreign-sdks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        linkage: [static, shared]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - name: Install Zig 0.17.0 with verified checksum
        shell: bash
        run: |
          if [[ "$(uname -s)-$(uname -m)" == Darwin-arm64 ]]; then
            archive=zig-aarch64-macos-0.17.0
            digest=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
          elif [[ "$(uname -s)" == Darwin ]]; then
            archive=zig-x86_64-macos-0.17.0
            digest=4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6
          else
            archive=zig-x86_64-linux-0.17.0
            digest=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          fi
          curl -fsSL "https://ziglang.org/download/0.17.0/$archive.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          actual=$(shasum -a 256 "$RUNNER_TEMP/zig.tar.xz" | cut -d ' ' -f 1)
          test "$actual" = "$digest"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "ZIG_BIN=$RUNNER_TEMP/$archive/zig" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust and Zig host/guest conformance
        run: scripts/plugin-crosslang.sh
      - name: Shared C engine conformance
        env:
          EXT_CENGINE_BUILD_DIR: ${{ runner.temp }}/ext-cengine-proof
          EXT_CENGINE_LINKAGE: ${{ matrix.linkage }}
          CC: clang
        run: scripts/plugin-cengine.sh
      - name: Portable guest core in WASI
        env:
          EXT_WASI_CORE_BUILD_DIR: ${{ runner.temp }}/ext-wasi-core
        run: scripts/plugin-wasi-core.sh
      - name: Foreign runtime conformance through the C session
        env:
          EXT_CROSSLANG_ENGINE: c
          EXT_CENGINE_LINKAGE: ${{ matrix.linkage }}
          EXT_CENGINE_BUILD_DIR: ${{ runner.temp }}/ext-cengine-proof
        run: scripts/plugin-crosslang.sh
      - name: Preserve prototype measurements
        uses: actions/upload-artifact@v4
        with:
          name: cengine-measurements-${{ matrix.os }}-${{ matrix.linkage }}
          path: |
            ${{ runner.temp }}/ext-cengine-proof/benchmarks.jsonl
            ${{ runner.temp }}/ext-cengine-proof/benchmark-report.md

      - name: Cross-runtime interoperability
        env:
          EXT_INTEROP_BUILD_DIR: ${{ runner.temp }}/ext-interop-proof
          EXT_CENGINE_BUILD_DIR: ${{ runner.temp }}/ext-cengine-proof
          EXT_INTEROP_REUSE_CENGINE: '1'
        run: scripts/plugin-interop.sh
      - name: Bidirectional bridge with C-owned sessions
        env:
          EXT_INTEROP_ENGINE: c
          EXT_CENGINE_LINKAGE: ${{ matrix.linkage }}
          EXT_INTEROP_BUILD_DIR: ${{ runner.temp }}/ext-interop-c
          EXT_CENGINE_BUILD_DIR: ${{ runner.temp }}/ext-cengine-proof
          EXT_INTEROP_REUSE_CENGINE: '1'
        run: scripts/plugin-interop.sh

  # The Swift and Java modules of the web rules (res/web/ios, res/web/android) against res/web/testdata
  # and against what the Go module answers for a generated corpus. Neither needs the engine, so this
  # does not wait for the C builds.
  web-ports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'  # the version the ports were checked against; net/url changes between releases
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: go test ./res/web/...
        working-directory: res/web
      - name: Swift and Java ports against Go
        run: scripts/web-differential.sh
