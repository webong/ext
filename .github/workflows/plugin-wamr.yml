name: Plugin WAMR host

# The optional in-process WebAssembly host (WAMR) bound into pkg/ext-ios and pkg/ext-android. It
# fetches WAMR, builds an interpreter and boots an emulator and a simulator, so a pull request runs
# it only when asked. Its jobs:
#   jdk      desktop JDK suite (Linux)
#   emulator Android emulator suite (Linux, KVM; platform:android)
#   apple    macOS Swift tests and the iOS Simulator suite, together (macOS; platform:ios)
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

env:
  # The WAMR checkout is cached on the commit pinned in scripts/plugin-wamr.sh.
  EXT_CACHE: ${{ github.workspace }}/.cache/ext

jobs:
  # Desktop JDK: builds libextwamrjni and runs the 12 checks. Linux minutes are the cheap ones.
  jdk:
    if: toJSON(fromJSON(inputs.cells)['jdk']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['jdk'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-wasip1
      - uses: actions/cache@v5
        with:
          path: .cache/ext
          key: wamr-${{ hashFiles('scripts/plugin-wamr.sh') }}
      - run: scripts/ext-android-wamr.sh

  # Android emulator: cross-builds with the NDK and runs the same 12 checks in a test app, then
  # tests the staged AAR the way an app consumes it. The
  # runner has KVM, so an x86_64 image is fast; the device script follows the device's ABI. Real
  # arm64 devices stay manual.
  emulator:
    if: toJSON(fromJSON(inputs.cells)['emulator']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['emulator'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-wasip1
      - uses: actions/cache@v5
        with:
          path: .cache/ext
          key: wamr-${{ hashFiles('scripts/plugin-wamr.sh') }}
      # The consumer app builds with Gradle; AGP 8.12 needs 8.13 or later, so pin it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # One boot, three suites: the WAMR host in a test app, then an app that consumes the
          # staged AAR (R8 on) with the default build and with the WAMR build.
          script: |
            scripts/ext-android-wamr-device.sh
            scripts/ext-android-consumer.sh
            scripts/ext-android-consumer.sh --with-wamr

  # One macOS job for both Apple suites, because macOS minutes cost about ten times Linux:
  # the Swift tests on the host, then the same tests in an iOS Simulator.
  apple:
    if: toJSON(fromJSON(inputs.cells)['apple']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['apple'] }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-wasip1
      - uses: actions/cache@v5
        with:
          path: .cache/ext
          key: wamr-${{ hashFiles('scripts/plugin-wamr.sh') }}
      - name: macOS (Swift tests on the host)
        run: scripts/ext-ios-wamr.sh
      - name: iOS Simulator
        run: |
          set -euo pipefail
          reactor="$RUNNER_TEMP/reactor.wasm"
          CARGO_TARGET_DIR="$RUNNER_TEMP/cargo" cargo build --release --locked \
            --manifest-path pkg/ext-rust/Cargo.toml --target wasm32-wasip1 --example shared
          cp "$RUNNER_TEMP/cargo/wasm32-wasip1/release/examples/shared.wasm" "$reactor"
          # The frameworks were built by the step above. Pick an installed iPhone simulator.
          device="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')"
          [[ -n "$device" ]] || { echo 'no iPhone simulator is installed' >&2; exit 1; }
          cd pkg/ext-ios
          TEST_RUNNER_EXT_RUST_REACTOR="$reactor" xcodebuild test -scheme Ext-Package \
            -destination "platform=iOS Simulator,id=$device" -only-testing:ExtPluginWamrTests
