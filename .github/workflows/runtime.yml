name: Runtime

# Language SDKs, native libraries, and platform integrations. See docs/ci.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      labels:
        description: Labels to plan with, comma-separated (tool:<name>, platform:<name>, ci:full, release:<package>)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      workflow: runtime
      labels: ${{ inputs.labels }}
