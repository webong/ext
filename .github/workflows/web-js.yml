name: Web JS

# The browser smoke tests need a browser and are run by hand; see pkg/ext-web/COMPATIBILITY.md.
#
# Called by ci.yml, which picks the jobs and matrix cells from .github/ci/areas.json (docs/ci.md).
on:
  # Called by ci.yml, which plans the run (scripts/ci/plan.py, .github/ci/areas.json).
  workflow_call:
    inputs:
      cells:
        description: JSON object from each job's name to the matrix cells it runs
        type: string
        required: true

permissions:
  contents: read

jobs:
  extension-library:
    if: toJSON(fromJSON(inputs.cells)['extension-library']) != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cells)['extension-library'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test
        working-directory: pkg/ext-web
        run: npm test
      - name: Check TypeScript declarations
        run: npx --yes --package typescript@5.8.3 tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 pkg/ext-web/typecheck.mts
      - name: Build example extensions
        working-directory: pkg/ext-web
        run: npm run build:examples
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      # The built examples must pass the Go inspector and packager that ext uses for every extension.
      # EXT_WEB_DIST makes a missing build a failure instead of a skip.
      - name: Package the examples with the Go tooling
        working-directory: res/web/host
        env:
          EXT_WEB_DIST: ${{ github.workspace }}/pkg/ext-web/dist
        run: go test ./artifact/extension -run TestExtWebExamplesPackage -count=1 -v
