[project]
name = "ext-plugin"
version = "0.1.0"
description = "Guest SDK for ext.plugin/v1 over JSON lines (standard library only)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ext", "plugin", "sdk", "ext-plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/webong/ext/tree/main/pkg/ext-python"
Repository = "https://github.com/webong/ext"
Issues = "https://github.com/webong/ext/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ext_plugin"]
