[package]
name = "ext-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Typed host and guest SDK for the ext.plugin/v1 plugin protocol"
license = "MIT"
readme = "README.md"
repository = "https://github.com/webong/ext"
homepage = "https://github.com/webong/ext/tree/main/pkg/ext-rust"
keywords = ["plugin", "sdk", "ext", "ffi", "wasi"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
libloading = "0.8"

[[example]]
name = "shared"
crate-type = ["cdylib"]
