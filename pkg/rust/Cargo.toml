[package]
name = "ctx-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "CTX typed plugin host and guest SDK"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
libloading = "0.8"

[[example]]
name = "shared"
crate-type = ["cdylib"]
